version: "3.9"

services:
  postgres:
    image: postgres:latest
    container_name: sis_postgres
    restart: always
    environment:
      POSTGRES_USER: sis_user
      POSTGRES_PASSWORD: sis_password
      POSTGRES_DB: sis_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
