name: C++ Build (CMake)

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libpq-dev libpqxx-dev

      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build
